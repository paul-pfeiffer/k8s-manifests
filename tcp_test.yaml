apiVersion: v1
kind: Pod
metadata:
  name: tcp-test
  namespace: default
spec:
  hostNetwork: true
  containers:
  - name: test
    image: alpine:latest
    command: ["/bin/sh", "-c"]
    args:
    - "apk add --no-cache curl bash > /dev/null 2>&1; echo '===TCP_13.212.144.69_443==='; timeout 3 bash -c 'echo > /dev/tcp/13.212.144.69/443 && echo OPEN' 2>&1 || echo CLOSED; echo '===TCP_13.212.144.69_80==='; timeout 3 bash -c 'echo > /dev/tcp/13.212.144.69/80 && echo OPEN' 2>&1 || echo CLOSED; echo '===TCP_google_443==='; timeout 3 bash -c 'echo > /dev/tcp/142.250.80.4/443 && echo OPEN' 2>&1 || echo CLOSED; echo '===CURL_IP==='; curl -sk -m3 -o /dev/null -w '%{http_code}' https://13.212.144.69:443/; echo; echo '===CURL_GOOGLE==='; curl -sk -m3 -o /dev/null -w '%{http_code}' https://google.com/; echo; echo '===DONE==='; sleep 60"
  restartPolicy: Never
