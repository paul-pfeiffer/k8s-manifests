apiVersion: v1
kind: Pod
metadata:
  name: test8443
  namespace: default
spec:
  hostNetwork: true
  containers:
  - name: test
    image: alpine:latest
    command: ["/bin/sh", "-c"]
    args:
    - "apk add --no-cache curl > /dev/null 2>&1; echo '===8443==='; curl -sk -m5 -o /dev/null -w '%{http_code}' https://ssl.jetbrainsteam.com:8443/; echo; echo '===443==='; curl -sk -m5 -o /dev/null -w '%{http_code}' https://ssl.jetbrainsteam.com:443/; echo; echo 'DONE'; sleep 60"
  restartPolicy: Never
