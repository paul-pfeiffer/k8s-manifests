apiVersion: v1
kind: Pod
metadata:
  name: test-ext
  namespace: default
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: test
    image: alpine:latest
    command: ["/bin/sh", "-c"]
    args:
    - "apk add --no-cache curl > /dev/null 2>&1; nsenter --target 1 --mount --uts --ipc --net --pid -- curl -sk -m5 -o /dev/null -w '%{http_code}' https://google.com 2>&1; echo; echo DONE; sleep 60"
    securityContext:
      privileged: true
    volumeMounts:
    - name: host
      mountPath: /host
  volumes:
  - name: host
    hostPath:
      path: /
  restartPolicy: Never
