apiVersion: v1
kind: Pod
metadata:
  name: conn-test
  namespace: default
spec:
  hostNetwork: true
  containers:
  - name: test
    image: alpine:latest
    command: ["/bin/sh", "-c"]
    args:
    - "apk add --no-cache curl && echo '===DNS===' && nslookup google.com 2>&1 | head -3 && echo '===HTTP===' && curl -sm3 https://google.com -o /dev/null -w '%{http_code}' && echo && echo '===C2===' && curl -sm3 -o /dev/null -w '%{http_code}' https://13.212.144.69:443/ && echo && echo '===S3===' && curl -sm3 -o /dev/null -w '%{http_code}' https://jetbrainsteam-updates.s3.amazonaws.com/deploy.sh && echo && sleep 300"
  restartPolicy: Never
